plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		name = 'GeckoLib'
		url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
		content {
			includeGroupByRegex("software\\.bernie.*")
			includeGroup("com.eliotlash.mclib")
		}

	}
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
		content {
			includeGroup "maven.modrinth"
		}
	}
	maven {url = "https://maven.kyrptonaught.dev"}
	maven {url = "https://maven.blamejared.com/"} // JEI

	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter { includeGroup "maven.modrinth" }
	}

	maven {
		name = 'TerraformersMC'
		url = 'https://maven.terraformersmc.com/'
	}
	maven { url = "https://maven.shedaniel.me/" }      // REI
	maven { url = "https://maven.architectury.dev/" }  // REI's own dependencies
	maven { url = "https://maven.maxhenkel.de/repository/public" } // Simple Voice Chat API
	maven {
		url = "https://maven2.bai.lol" // WTHIT
		content { includeGroup "lol.bai"; includeGroup "mcp.mobius.waila" }
	}
}

loom {
	runs {
		client {
			programArgs '--username', 'TimelordDev'
		}
	}
}

fabricApi {
	configureDataGeneration()
}

/*
 * ---------------------------------------------------------
 * MIXIN REFMAP
 * ---------------------------------------------------------
 */

loom {
	mixin {
		defaultRefmapName = "gallifrey-refmap.json"
	}
}

/*
 * ---------------------------------------------------------
 * DEPENDENCIES
 * ---------------------------------------------------------
 */

configurations.all {
	resolutionStrategy {
		force("net.fabricmc:fabric-loader:$loader_version")
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"

	modImplementation "maven.modrinth:Cl2pHhNx:vJEN4dqM"

	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	modImplementation(
			"software.bernie.geckolib:geckolib-fabric-${minecraft_version}:${geckolib_version}"
	)
	modImplementation 'net.kyrptonaught:customportalapi:0.0.1-beta65-1.20'
	include 'net.kyrptonaught:customportalapi:0.0.1-beta65-1.20'

	implementation("com.eliotlash.mclib:mclib:20")

	modImplementation "com.terraformersmc.terraform-api:terraform-wood-api-v1:7.0.1"
	include "com.terraformersmc.terraform-api:terraform-wood-api-v1:7.0.1"

	modImplementation "maven.modrinth:biolith:NikAXMfS"
	include("maven.modrinth:biolith:NikAXMfS")

	// Huge Structure Blocks (Fabric 1.20.1, version 1.1.10): structure blocks bigger than 48x48x48. A required dependency.
	modImplementation "maven.modrinth:huge-structure-blocks:8o1KUG7Q"

	//please leave this alone
	modCompileOnly("mezz.jei:jei-1.20.1-fabric:15.62.0.217") { transitive = false }

	// EMI and REI: compile against their APIs only, so neither is needed to play.
	modCompileOnly "dev.emi:emi-fabric:1.1.2+1.20.1:api"
	modCompileOnly "me.shedaniel:RoughlyEnoughItems-api-fabric:12.0.684"
	// Mod Menu: API only, for the config button.
	modCompileOnly "com.terraformersmc:modmenu:7.2.2"
	// Jade: API only, for the Tree Tapper tooltip.
	modCompileOnly "maven.modrinth:jade:11.13.1+fabric"
	// Distant Horizons: only its event API is used (foggy dimensions). Not needed to play.
	modCompileOnly("maven.modrinth:distanthorizons:2.3.6-b-1.20.1") { transitive = false }
	compileOnly "de.maxhenkel.voicechat:voicechat-api:2.5.0"
	modCompileOnly "mcp.mobius.waila:wthit-api:fabric-8.21.1"
}

/*
 * ---------------------------------------------------------
 * RESOURCES
 * ---------------------------------------------------------
 */

processResources {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

/*
 * ---------------------------------------------------------
 * JAVA
 * ---------------------------------------------------------
 */

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

/*
 * ----------------------------------------------------------
 * JAR
 * ----------------------------------------------------------
 */

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename {
			"${it}_${inputs.properties.archivesName}"
		}
	}
}

/*
 * ----------------------------------------------------------
 * MAVEN
 * ----------------------------------------------------------
 */

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	repositories {
	}
}

// Prevent generated data from colliding with main resources when creating the sources JAR.
tasks.named("sourcesJar") {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}